<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  
    <defs>
      <linearGradient id="metalGrad_tiffany-harmony-rg-3mm" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FCECE9" />
        <stop offset="30%" stop-color="#E8A598" />
        <stop offset="70%" stop-color="#B86B5D" />
        <stop offset="100%" stop-color="#7E3B2F" />
      </linearGradient>

      <linearGradient id="innerGrad_tiffany-harmony-rg-3mm" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#B86B5D" />
        <stop offset="50%" stop-color="#7E3B2F" />
        <stop offset="100%" stop-color="#B86B5D" />
      </linearGradient>

      <radialGradient id="bgGrad_tiffany-harmony-rg-3mm" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#1E293B" />
        <stop offset="100%" stop-color="#0F172A" />
      </radialGradient>

      <filter id="glow_tiffany-harmony-rg-3mm" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <filter id="sparkle_tiffany-harmony-rg-3mm" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
    

  <!-- Dark Luxury Background -->
  <rect width="400" height="400" fill="url(#bgGrad_tiffany-harmony-rg-3mm)" rx="24" />

  <!-- Subtle Glow Aura behind ring -->
  <ellipse cx="200" cy="205" rx="130" ry="70" fill="rgba(232, 165, 152, 0.4)" filter="url(#glow_tiffany-harmony-rg-3mm)" opacity="0.6" />

  <!-- Brand Signature Header -->
  <text x="200" y="44" font-family="'Cinzel', 'Georgia', serif" font-size="14" font-weight="700" fill="#FCECE9" letter-spacing="3" text-anchor="middle" opacity="0.9">TIFFANY & CO.</text>
  <line x1="160" y1="54" x2="240" y2="54" stroke="#E8A598" stroke-width="1" opacity="0.4" />

  <!-- MAIN RING 3D STRUCTURE -->
  <g id="ring_body">
    <!-- Outer Ring Base Shadow & Body -->
    <path d="M 90,190 A 110,55 0 0,0 310,190 L 310,210 A 110,55 0 0,1 90,210 Z" fill="#7E3B2F" />

    <!-- Main Outer Band Wall -->
    <path d="M 90,188 A 110,55 0 0,0 310,188 L 310,208 A 110,55 0 0,1 90,208 Z" fill="url(#metalGrad_tiffany-harmony-rg-3mm)" />

    <!-- Inner Ring Hole / Depth Wall -->
    <ellipse cx="200" cy="188" rx="86" ry="42" fill="url(#innerGrad_tiffany-harmony-rg-3mm)" stroke="#B86B5D" stroke-width="1.5" />
    
    <!-- Top Edge Rim Highlight -->
    <ellipse cx="200" cy="188" rx="110" ry="55" fill="none" stroke="#FCECE9" stroke-width="2.5" opacity="0.85" />
    <ellipse cx="200" cy="208" rx="110" ry="55" fill="none" stroke="#7E3B2F" stroke-width="1.5" opacity="0.6" />
    
    <!-- Brand Patterns -->
    

    <!-- Diamonds -->
    
  </g>

  <!-- Model Name Footer Pill -->
  <g transform="translate(200, 355)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="#E8A598" stroke-width="1" />
    <text x="0" y="5" font-family="'Pretendard', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC" text-anchor="middle">티파니 하모니 웨딩 밴드 (로즈골드 3mm)</text>
  </g>
</svg>
