<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  
    <defs>
      <linearGradient id="metalGrad_chaumet-bee-1d" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FEF08A" />
        <stop offset="30%" stop-color="#EAB308" />
        <stop offset="70%" stop-color="#CA8A04" />
        <stop offset="100%" stop-color="#854D0E" />
      </linearGradient>

      <linearGradient id="innerGrad_chaumet-bee-1d" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#CA8A04" />
        <stop offset="50%" stop-color="#854D0E" />
        <stop offset="100%" stop-color="#CA8A04" />
      </linearGradient>

      <radialGradient id="bgGrad_chaumet-bee-1d" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#1E293B" />
        <stop offset="100%" stop-color="#0F172A" />
      </radialGradient>

      <filter id="glow_chaumet-bee-1d" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <filter id="sparkle_chaumet-bee-1d" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
    

  <!-- Dark Luxury Background -->
  <rect width="400" height="400" fill="url(#bgGrad_chaumet-bee-1d)" rx="24" />

  <!-- Subtle Glow Aura behind ring -->
  <ellipse cx="200" cy="205" rx="130" ry="70" fill="rgba(234, 179, 8, 0.4)" filter="url(#glow_chaumet-bee-1d)" opacity="0.6" />

  <!-- Brand Signature Header -->
  <text x="200" y="44" font-family="'Cinzel', 'Georgia', serif" font-size="14" font-weight="700" fill="#FEF08A" letter-spacing="3" text-anchor="middle" opacity="0.9">CHAUMET</text>
  <line x1="160" y1="54" x2="240" y2="54" stroke="#EAB308" stroke-width="1" opacity="0.4" />

  <!-- MAIN RING 3D STRUCTURE -->
  <g id="ring_body">
    <!-- Outer Ring Base Shadow & Body -->
    <path d="M 90,190 A 110,55 0 0,0 310,190 L 310,210 A 110,55 0 0,1 90,210 Z" fill="#854D0E" />

    <!-- Main Outer Band Wall -->
    <path d="M 90,188 A 110,55 0 0,0 310,188 L 310,208 A 110,55 0 0,1 90,208 Z" fill="url(#metalGrad_chaumet-bee-1d)" />

    <!-- Inner Ring Hole / Depth Wall -->
    <ellipse cx="200" cy="188" rx="86" ry="42" fill="url(#innerGrad_chaumet-bee-1d)" stroke="#CA8A04" stroke-width="1.5" />
    
    <!-- Top Edge Rim Highlight -->
    <ellipse cx="200" cy="188" rx="110" ry="55" fill="none" stroke="#FEF08A" stroke-width="2.5" opacity="0.85" />
    <ellipse cx="200" cy="208" rx="110" ry="55" fill="none" stroke="#854D0E" stroke-width="1.5" opacity="0.6" />
    
    <!-- Brand Patterns -->
    <polygon points="300.0,192.0 306.0,189.0 312.0,192.0 312.0,198.0 306.0,201.0 300.0,198.0" fill="none" stroke="#FEF08A" stroke-width="1.2" /><polygon points="285.79869280115054,217.0 291.79869280115054,214.0 297.79869280115054,217.0 297.79869280115054,223.0 291.79869280115054,226.0 285.79869280115054,223.0" fill="none" stroke="#FEF08A" stroke-width="1.2" /><polygon points="247.0,235.30127018922192 253.0,232.30127018922192 259.0,235.30127018922192 259.0,241.30127018922192 253.0,244.30127018922192 247.0,241.30127018922192" fill="none" stroke="#FEF08A" stroke-width="1.2" /><polygon points="194.0,242.0 200.0,239.0 206.0,242.0 206.0,248.0 200.0,251.0 194.0,248.0" fill="none" stroke="#FEF08A" stroke-width="1.2" /><polygon points="141.0,235.30127018922195 147.0,232.30127018922195 153.0,235.30127018922195 153.0,241.30127018922195 147.0,244.30127018922195 141.0,241.30127018922195" fill="none" stroke="#FEF08A" stroke-width="1.2" /><polygon points="102.20130719884949,217.0 108.20130719884949,214.0 114.20130719884949,217.0 114.20130719884949,223.0 108.20130719884949,226.0 102.20130719884949,223.0" fill="none" stroke="#FEF08A" stroke-width="1.2" /><polygon points="88.0,192.0 94.0,189.0 100.0,192.0 100.0,198.0 94.0,201.0 88.0,198.0" fill="none" stroke="#FEF08A" stroke-width="1.2" /><polygon points="102.2013071988495,167.0 108.2013071988495,164.0 114.2013071988495,167.0 114.2013071988495,173.0 108.2013071988495,176.0 102.2013071988495,173.0" fill="none" stroke="#FEF08A" stroke-width="1.2" /><polygon points="140.99999999999994,148.69872981077808 146.99999999999994,145.69872981077808 152.99999999999994,148.69872981077808 152.99999999999994,154.69872981077808 146.99999999999994,157.69872981077808 140.99999999999994,154.69872981077808" fill="none" stroke="#FEF08A" stroke-width="1.2" /><polygon points="193.99999999999997,142.0 199.99999999999997,139.0 205.99999999999997,142.0 205.99999999999997,148.0 199.99999999999997,151.0 193.99999999999997,148.0" fill="none" stroke="#FEF08A" stroke-width="1.2" /><polygon points="247.0,148.69872981077808 253.0,145.69872981077808 259.0,148.69872981077808 259.0,154.69872981077808 253.0,157.69872981077808 247.0,154.69872981077808" fill="none" stroke="#FEF08A" stroke-width="1.2" /><polygon points="285.7986928011505,166.99999999999997 291.7986928011505,163.99999999999997 297.7986928011505,166.99999999999997 297.7986928011505,172.99999999999997 291.7986928011505,175.99999999999997 285.7986928011505,172.99999999999997" fill="none" stroke="#FEF08A" stroke-width="1.2" />

    <!-- Diamonds -->
    
        <g transform="translate(200, 245)" filter="url(#sparkle_chaumet-bee-1d)">
          <polygon points="0,-12 4,-4 12,0 4,4 0,12 -4,4 -12,0 -4,-4" fill="#FFFFFF" />
          <circle cx="0" cy="0" r="5.5" fill="#FFFFFF" />
          <circle cx="0" cy="0" r="3.2" fill="#E0F2FE" />
        </g>
        
  </g>

  <!-- Model Name Footer Pill -->
  <g transform="translate(200, 355)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="#EAB308" stroke-width="1" />
    <text x="0" y="5" font-family="'Pretendard', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC" text-anchor="middle">비 마이 러브 링 (1다이아)</text>
  </g>
</svg>
