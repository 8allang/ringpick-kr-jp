<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  
    <defs>
      <linearGradient id="metalGrad_boucheron-quatre-jal00300" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="30%" stop-color="#D1D5DB" />
        <stop offset="70%" stop-color="#9CA3AF" />
        <stop offset="100%" stop-color="#4B5563" />
      </linearGradient>

      <linearGradient id="innerGrad_boucheron-quatre-jal00300" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#9CA3AF" />
        <stop offset="50%" stop-color="#4B5563" />
        <stop offset="100%" stop-color="#9CA3AF" />
      </linearGradient>

      <radialGradient id="bgGrad_boucheron-quatre-jal00300" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#1E293B" />
        <stop offset="100%" stop-color="#0F172A" />
      </radialGradient>

      <filter id="glow_boucheron-quatre-jal00300" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <filter id="sparkle_boucheron-quatre-jal00300" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
    

  <!-- Dark Luxury Background -->
  <rect width="400" height="400" fill="url(#bgGrad_boucheron-quatre-jal00300)" rx="24" />

  <!-- Subtle Glow Aura behind ring -->
  <ellipse cx="200" cy="205" rx="130" ry="70" fill="rgba(209, 213, 219, 0.4)" filter="url(#glow_boucheron-quatre-jal00300)" opacity="0.6" />

  <!-- Brand Signature Header -->
  <text x="200" y="44" font-family="'Cinzel', 'Georgia', serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="3" text-anchor="middle" opacity="0.9">BOUCHERON</text>
  <line x1="160" y1="54" x2="240" y2="54" stroke="#D1D5DB" stroke-width="1" opacity="0.4" />

  <!-- MAIN RING 3D STRUCTURE -->
  <g id="ring_body">
    <!-- Outer Ring Base Shadow & Body -->
    <path d="M 90,190 A 110,55 0 0,0 310,190 L 310,210 A 110,55 0 0,1 90,210 Z" fill="#4B5563" />

    <!-- Main Outer Band Wall -->
    <path d="M 90,188 A 110,55 0 0,0 310,188 L 310,208 A 110,55 0 0,1 90,208 Z" fill="url(#metalGrad_boucheron-quatre-jal00300)" />

    <!-- Inner Ring Hole / Depth Wall -->
    <ellipse cx="200" cy="188" rx="86" ry="42" fill="url(#innerGrad_boucheron-quatre-jal00300)" stroke="#9CA3AF" stroke-width="1.5" />
    
    <!-- Top Edge Rim Highlight -->
    <ellipse cx="200" cy="188" rx="110" ry="55" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.85" />
    <ellipse cx="200" cy="208" rx="110" ry="55" fill="none" stroke="#4B5563" stroke-width="1.5" opacity="0.6" />
    
    <!-- Brand Patterns -->
    
            <ellipse cx="200" cy="186" rx="108" ry="52" fill="none" stroke="#D4AF37" stroke-width="4" />
            <ellipse cx="200" cy="191" rx="108" ry="52" fill="none" stroke="#E2E8F0" stroke-width="4" />
            <ellipse cx="200" cy="196" rx="108" ry="52" fill="none" stroke="#5C3A21" stroke-width="4" />
            <ellipse cx="200" cy="201" rx="108" ry="52" fill="none" stroke="#EAB308" stroke-width="4" />
            

    <!-- Diamonds -->
    
  </g>

  <!-- Model Name Footer Pill -->
  <g transform="translate(200, 355)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="#D1D5DB" stroke-width="1" />
    <text x="0" y="5" font-family="'Pretendard', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC" text-anchor="middle">콰트로 더블 화이트 에디션 밴드 (JAL00300)</text>
  </g>
</svg>
