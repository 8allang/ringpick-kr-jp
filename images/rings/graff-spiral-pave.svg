<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  
    <defs>
      <linearGradient id="metalGrad_graff-spiral-pave" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FEF08A" />
        <stop offset="30%" stop-color="#EAB308" />
        <stop offset="70%" stop-color="#CA8A04" />
        <stop offset="100%" stop-color="#854D0E" />
      </linearGradient>

      <linearGradient id="innerGrad_graff-spiral-pave" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#CA8A04" />
        <stop offset="50%" stop-color="#854D0E" />
        <stop offset="100%" stop-color="#CA8A04" />
      </linearGradient>

      <radialGradient id="bgGrad_graff-spiral-pave" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#1E293B" />
        <stop offset="100%" stop-color="#0F172A" />
      </radialGradient>

      <filter id="glow_graff-spiral-pave" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <filter id="sparkle_graff-spiral-pave" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
    

  <!-- Dark Luxury Background -->
  <rect width="400" height="400" fill="url(#bgGrad_graff-spiral-pave)" rx="24" />

  <!-- Subtle Glow Aura behind ring -->
  <ellipse cx="200" cy="205" rx="130" ry="70" fill="rgba(234, 179, 8, 0.4)" filter="url(#glow_graff-spiral-pave)" opacity="0.6" />

  <!-- Brand Signature Header -->
  <text x="200" y="44" font-family="'Cinzel', 'Georgia', serif" font-size="14" font-weight="700" fill="#FEF08A" letter-spacing="3" text-anchor="middle" opacity="0.9">GRAFF</text>
  <line x1="160" y1="54" x2="240" y2="54" stroke="#EAB308" stroke-width="1" opacity="0.4" />

  <!-- MAIN RING 3D STRUCTURE -->
  <g id="ring_body">
    <!-- Outer Ring Base Shadow & Body -->
    <path d="M 90,190 A 110,55 0 0,0 310,190 L 310,210 A 110,55 0 0,1 90,210 Z" fill="#854D0E" />

    <!-- Main Outer Band Wall -->
    <path d="M 90,188 A 110,55 0 0,0 310,188 L 310,208 A 110,55 0 0,1 90,208 Z" fill="url(#metalGrad_graff-spiral-pave)" />

    <!-- Inner Ring Hole / Depth Wall -->
    <ellipse cx="200" cy="188" rx="86" ry="42" fill="url(#innerGrad_graff-spiral-pave)" stroke="#CA8A04" stroke-width="1.5" />
    
    <!-- Top Edge Rim Highlight -->
    <ellipse cx="200" cy="188" rx="110" ry="55" fill="none" stroke="#FEF08A" stroke-width="2.5" opacity="0.85" />
    <ellipse cx="200" cy="208" rx="110" ry="55" fill="none" stroke="#854D0E" stroke-width="1.5" opacity="0.6" />
    
    <!-- Brand Patterns -->
    

