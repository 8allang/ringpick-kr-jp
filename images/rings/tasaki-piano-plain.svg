<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  
    <defs>
      <linearGradient id="metalGrad_tasaki-piano-plain" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FEF08A" />
        <stop offset="30%" stop-color="#EAB308" />
        <stop offset="70%" stop-color="#CA8A04" />
        <stop offset="100%" stop-color="#854D0E" />
      </linearGradient>

      <linearGradient id="innerGrad_tasaki-piano-plain" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#CA8A04" />
        <stop offset="50%" stop-color="#854D0E" />
        <stop offset="100%" stop-color="#CA8A04" />
      </linearGradient>

      <radialGradient id="bgGrad_tasaki-piano-plain" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#1E293B" />
        <stop offset="100%" stop-color="#0F172A" />
      </radialGradient>

      <filter id="glow_tasaki-piano-plain" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <filter id="sparkle_tasaki-piano-plain" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
    

  <!-- Dark Luxury Background -->
  <rect width="400" height="400" fill="url(#bgGrad_tasaki-piano-plain)" rx="24" />

  <!-- Subtle Glow Aura behind ring -->
  <ellipse cx="200" cy="205" rx="130" ry="70" fill="rgba(234, 179, 8, 0.4)" filter="url(#glow_tasaki-piano-plain)" opacity="0.6" />

  <!-- Brand Signature Header -->
  <text x="200" y="44" font-family="'Cinzel', 'Georgia', serif" font-size="14" font-weight="700" fill="#FEF08A" letter-spacing="3" text-anchor="middle" opacity="0.9">TASAKI</text>
  <line x1="160" y1="54" x2="240" y2="54" stroke="#EAB308" stroke-width="1" opacity="0.4" />

  <!-- MAIN RING 3D STRUCTURE -->
  <g id="ring_body">
    <!-- Outer Ring Base Shadow & Body -->
    <path d="M 90,190 A 110,55 0 0,0 310,190 L 310,210 A 110,55 0 0,1 90,210 Z" fill="#854D0E" />

    <!-- Main Outer Band Wall -->
    <path d="M 90,188 A 110,55 0 0,0 310,188 L 310,208 A 110,55 0 0,1 90,208 Z" fill="url(#metalGrad_tasaki-piano-plain)" />

    <!-- Inner Ring Hole / Depth Wall -->
    <ellipse cx="200" cy="188" rx="86" ry="42" fill="url(#innerGrad_tasaki-piano-plain)" stroke="#CA8A04" stroke-width="1.5" />
    
    <!-- Top Edge Rim Highlight -->
    <ellipse cx="200" cy="188" rx="110" ry="55" fill="none" stroke="#FEF08A" stroke-width="2.5" opacity="0.85" />
    <ellipse cx="200" cy="208" rx="110" ry="55" fill="none" stroke="#854D0E" stroke-width="1.5" opacity="0.6" />
    
    <!-- Brand Patterns -->
    <rect x="305.0" y="186.0" width="4" height="14" fill="#854D0E" opacity="0.6" /><rect x="296.8551099787077" y="205.1341716182545" width="4" height="14" fill="#854D0E" opacity="0.6" /><rect x="273.66042558696057" y="221.35533905932738" width="4" height="14" fill="#854D0E" opacity="0.6" /><rect x="238.9471272630646" y="232.19397662556435" width="4" height="14" fill="#854D0E" opacity="0.6" /><rect x="198.0" y="236.0" width="4" height="14" fill="#854D0E" opacity="0.6" /><rect x="157.0528727369354" y="232.19397662556435" width="4" height="14" fill="#854D0E" opacity="0.6" /><rect x="122.33957441303941" y="221.35533905932738" width="4" height="14" fill="#854D0E" opacity="0.6" /><rect x="99.14489002129231" y="205.1341716182545" width="4" height="14" fill="#854D0E" opacity="0.6" /><rect x="91.0" y="186.0" width="4" height="14" fill="#854D0E" opacity="0.6" /><rect x="99.14489002129231" y="166.86582838174553" width="4" height="14" fill="#854D0E" opacity="0.6" /><rect x="122.3395744130394" y="150.64466094067262" width="4" height="14" fill="#854D0E" opacity="0.6" /><rect x="157.05287273693543" y="139.80602337443565" width="4" height="14" fill="#854D0E" opacity="0.6" /><rect x="197.99999999999997" y="136.0" width="4" height="14" fill="#854D0E" opacity="0.6" /><rect x="238.94712726306463" y="139.80602337443565" width="4" height="14" fill="#854D0E" opacity="0.6" /><rect x="273.66042558696057" y="150.64466094067262" width="4" height="14" fill="#854D0E" opacity="0.6" /><rect x="296.8551099787077" y="166.86582838174553" width="4" height="14" fill="#854D0E" opacity="0.6" />

    <!-- Diamonds -->
    
        <g transform="translate(200, 245)" filter="url(#sparkle_tasaki-piano-plain)">
          <polygon points="0,-12 4,-4 12,0 4,4 0,12 -4,4 -12,0 -4,-4" fill="#FFFFFF" />
          <circle cx="0" cy="0" r="5.5" fill="#FFFFFF" />
          <circle cx="0" cy="0" r="3.2" fill="#E0F2FE" />
        </g>
        
  </g>

  <!-- Model Name Footer Pill -->
  <g transform="translate(200, 355)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="#EAB308" stroke-width="1" />
    <text x="0" y="5" font-family="'Pretendard', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC" text-anchor="middle">피아노 링 20 (노다이아)</text>
  </g>
</svg>
