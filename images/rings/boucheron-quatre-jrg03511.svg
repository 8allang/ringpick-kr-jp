<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="metalGrad_boucheron-black-xs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="30%" stop-color="#94A3B8" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="innerGrad_boucheron-black-xs" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <radialGradient id="bgGrad_boucheron-black-xs" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>

    <filter id="glow_boucheron-black-xs" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Luxury Background -->
  <rect width="400" height="400" fill="url(#bgGrad_boucheron-black-xs)" rx="24" />

  <!-- Subtle Glow Aura behind ring -->
  <ellipse cx="200" cy="205" rx="130" ry="70" fill="rgba(148, 163, 184, 0.4)" filter="url(#glow_boucheron-black-xs)" opacity="0.6" />

  <!-- Brand Signature Header -->
  <text x="200" y="44" font-family="'Cinzel', 'Georgia', serif" font-size="14" font-weight="700" fill="#E2E8F0" letter-spacing="3" text-anchor="middle" opacity="0.9">BOUCHERON</text>
  <line x1="160" y1="54" x2="240" y2="54" stroke="#94A3B8" stroke-width="1" opacity="0.4" />

  <!-- MAIN RING 3D STRUCTURE -->
  <g id="ring_body">
    <!-- Outer Ring Base Shadow & Body -->
    <path d="M 90,190 A 110,55 0 0,0 310,190 L 310,210 A 110,55 0 0,1 90,210 Z" fill="#0F172A" />

    <!-- Main Outer Band Wall -->
    <path d="M 90,188 A 110,55 0 0,0 310,188 L 310,208 A 110,55 0 0,1 90,208 Z" fill="url(#metalGrad_boucheron-black-xs)" />

    <!-- Inner Ring Hole / Depth Wall -->
    <ellipse cx="200" cy="188" rx="86" ry="42" fill="url(#innerGrad_boucheron-black-xs)" stroke="#475569" stroke-width="1.5" />
    
    <!-- Top Edge Rim Highlight -->
    <ellipse cx="200" cy="188" rx="110" ry="55" fill="none" stroke="#E2E8F0" stroke-width="2.5" opacity="0.85" />
    <ellipse cx="200" cy="208" rx="110" ry="55" fill="none" stroke="#0F172A" stroke-width="1.5" opacity="0.6" />
    
    <!-- Boucheron Quatre Black Edition Texture Layers -->
    <ellipse cx="200" cy="187" rx="108" ry="52" fill="none" stroke="#F8FAFC" stroke-width="3.5" />
    <ellipse cx="200" cy="193" rx="108" ry="52" fill="none" stroke="#1E293B" stroke-width="5" />
    <ellipse cx="200" cy="199" rx="108" ry="52" fill="none" stroke="#94A3B8" stroke-width="3.5" />
  </g>

  <!-- Model Name Footer Pill -->
  <g transform="translate(200, 355)">
    <rect x="-150" y="-16" width="300" height="32" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="#94A3B8" stroke-width="1" />
    <text x="0" y="5" font-family="'Pretendard', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC" text-anchor="middle">콰트로 블랙 에디션 XS (JRG03511)</text>
  </g>
</svg>
