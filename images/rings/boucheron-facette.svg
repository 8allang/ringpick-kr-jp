<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  
    <defs>
      <linearGradient id="metalGrad_boucheron-facette" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="30%" stop-color="#D1D5DB" />
        <stop offset="70%" stop-color="#9CA3AF" />
        <stop offset="100%" stop-color="#4B5563" />
      </linearGradient>

      <linearGradient id="innerGrad_boucheron-facette" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#9CA3AF" />
        <stop offset="50%" stop-color="#4B5563" />
        <stop offset="100%" stop-color="#9CA3AF" />
      </linearGradient>

      <radialGradient id="bgGrad_boucheron-facette" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#1E293B" />
        <stop offset="100%" stop-color="#0F172A" />
      </radialGradient>

      <filter id="glow_boucheron-facette" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <filter id="sparkle_boucheron-facette" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
    

  <!-- Dark Luxury Background -->
  <rect width="400" height="400" fill="url(#bgGrad_boucheron-facette)" rx="24" />

  <!-- Subtle Glow Aura behind ring -->
  <ellipse cx="200" cy="205" rx="130" ry="70" fill="rgba(209, 213, 219, 0.4)" filter="url(#glow_boucheron-facette)" opacity="0.6" />

  <!-- Brand Signature Header -->
  <text x="200" y="44" font-family="'Cinzel', 'Georgia', serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="3" text-anchor="middle" opacity="0.9">BOUCHERON</text>
  <line x1="160" y1="54" x2="240" y2="54" stroke="#D1D5DB" stroke-width="1" opacity="0.4" />

  <!-- MAIN RING 3D STRUCTURE -->
  <g id="ring_body">
    <!-- Outer Ring Base Shadow & Body -->
    <path d="M 90,190 A 110,55 0 0,0 310,190 L 310,210 A 110,55 0 0,1 90,210 Z" fill="#4B5563" />

    <!-- Main Outer Band Wall -->
    <path d="M 90,188 A 110,55 0 0,0 310,188 L 310,208 A 110,55 0 0,1 90,208 Z" fill="url(#metalGrad_boucheron-facette)" />

    <!-- Inner Ring Hole / Depth Wall -->
    <ellipse cx="200" cy="188" rx="86" ry="42" fill="url(#innerGrad_boucheron-facette)" stroke="#9CA3AF" stroke-width="1.5" />
    
    <!-- Top Edge Rim Highlight -->
    <ellipse cx="200" cy="188" rx="110" ry="55" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.85" />
    <ellipse cx="200" cy="208" rx="110" ry="55" fill="none" stroke="#4B5563" stroke-width="1.5" opacity="0.6" />
    
    <!-- Brand Patterns -->
    <polygon points="299.0,190.0 315.0,190.0 307.0,200.0" fill="#FFFFFF" opacity="0.3" stroke="#4B5563" stroke-width="1" /><polygon points="290.8551099787077,209.1341716182545 306.8551099787077,209.1341716182545 298.8551099787077,219.1341716182545" fill="#FFFFFF" opacity="0.3" stroke="#4B5563" stroke-width="1" /><polygon points="267.66042558696057,225.35533905932738 283.66042558696057,225.35533905932738 275.66042558696057,235.35533905932738" fill="#FFFFFF" opacity="0.3" stroke="#4B5563" stroke-width="1" /><polygon points="232.9471272630646,236.19397662556435 248.9471272630646,236.19397662556435 240.9471272630646,246.19397662556435" fill="#FFFFFF" opacity="0.3" stroke="#4B5563" stroke-width="1" /><polygon points="192.0,240.0 208.0,240.0 200.0,250.0" fill="#FFFFFF" opacity="0.3" stroke="#4B5563" stroke-width="1" /><polygon points="151.0528727369354,236.19397662556435 167.0528727369354,236.19397662556435 159.0528727369354,246.19397662556435" fill="#FFFFFF" opacity="0.3" stroke="#4B5563" stroke-width="1" /><polygon points="116.33957441303941,225.35533905932738 132.33957441303943,225.35533905932738 124.33957441303941,235.35533905932738" fill="#FFFFFF" opacity="0.3" stroke="#4B5563" stroke-width="1" /><polygon points="93.14489002129231,209.1341716182545 109.14489002129231,209.1341716182545 101.14489002129231,219.1341716182545" fill="#FFFFFF" opacity="0.3" stroke="#4B5563" stroke-width="1" /><polygon points="85.0,190.0 101.0,190.0 93.0,200.0" fill="#FFFFFF" opacity="0.3" stroke="#4B5563" stroke-width="1" /><polygon points="93.14489002129231,170.86582838174553 109.14489002129231,170.86582838174553 101.14489002129231,180.86582838174553" fill="#FFFFFF" opacity="0.3" stroke="#4B5563" stroke-width="1" /><polygon points="116.3395744130394,154.64466094067262 132.3395744130394,154.64466094067262 124.3395744130394,164.64466094067262" fill="#FFFFFF" opacity="0.3" stroke="#4B5563" stroke-width="1" /><polygon points="151.05287273693543,143.80602337443565 167.05287273693543,143.80602337443565 159.05287273693543,153.80602337443565" fill="#FFFFFF" opacity="0.3" stroke="#4B5563" stroke-width="1" /><polygon points="191.99999999999997,140.0 207.99999999999997,140.0 199.99999999999997,150.0" fill="#FFFFFF" opacity="0.3" stroke="#4B5563" stroke-width="1" /><polygon points="232.94712726306463,143.80602337443565 248.94712726306463,143.80602337443565 240.94712726306463,153.80602337443565" fill="#FFFFFF" opacity="0.3" stroke="#4B5563" stroke-width="1" /><polygon points="267.66042558696057,154.64466094067262 283.66042558696057,154.64466094067262 275.66042558696057,164.64466094067262" fill="#FFFFFF" opacity="0.3" stroke="#4B5563" stroke-width="1" /><polygon points="290.8551099787077,170.86582838174553 306.8551099787077,170.86582838174553 298.8551099787077,180.86582838174553" fill="#FFFFFF" opacity="0.3" stroke="#4B5563" stroke-width="1" />

    <!-- Diamonds -->
    
  </g>

  <!-- Model Name Footer Pill -->
  <g transform="translate(200, 355)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="#D1D5DB" stroke-width="1" />
    <text x="0" y="5" font-family="'Pretendard', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC" text-anchor="middle">파셋 웨딩 밴드 (플래티넘)</text>
  </g>
</svg>
