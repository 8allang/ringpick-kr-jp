<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  
    <defs>
      <linearGradient id="metalGrad_chaumet-torsade-pave" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="30%" stop-color="#D1D5DB" />
        <stop offset="70%" stop-color="#9CA3AF" />
        <stop offset="100%" stop-color="#4B5563" />
      </linearGradient>

      <linearGradient id="innerGrad_chaumet-torsade-pave" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#9CA3AF" />
        <stop offset="50%" stop-color="#4B5563" />
        <stop offset="100%" stop-color="#9CA3AF" />
      </linearGradient>

      <radialGradient id="bgGrad_chaumet-torsade-pave" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#1E293B" />
        <stop offset="100%" stop-color="#0F172A" />
      </radialGradient>

      <filter id="glow_chaumet-torsade-pave" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <filter id="sparkle_chaumet-torsade-pave" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
    

  <!-- Dark Luxury Background -->
  <rect width="400" height="400" fill="url(#bgGrad_chaumet-torsade-pave)" rx="24" />

  <!-- Subtle Glow Aura behind ring -->
