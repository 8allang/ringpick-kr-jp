<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="metalGrad_graff-spiral-plain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#D1D5DB" />
      <stop offset="70%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#4B5563" />
    </linearGradient>

    <linearGradient id="innerGrad_graff-spiral-plain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9CA3AF" />
      <stop offset="50%" stop-color="#4B5563" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </linearGradient>

    <radialGradient id="bgGrad_graff-spiral-plain" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>

    <filter id="glow_graff-spiral-plain" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="sparkle_graff-spiral-plain" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Luxury Background -->
  <rect width="400" height="400" fill="url(#bgGrad_graff-spiral-plain)" rx="24" />

  <!-- Glow Aura -->
  <ellipse cx="200" cy="205" rx="130" ry="70" fill="rgba(209, 213, 219, 0.4)" filter="url(#glow_graff-spiral-plain)" opacity="0.6" />

  <!-- Header -->
  <text x="200" y="44" font-family="'Cinzel', 'Georgia', serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="3" text-anchor="middle" opacity="0.9">GRAFF</text>
  <line x1="160" y1="54" x2="240" y2="54" stroke="#D1D5DB" stroke-width="1" opacity="0.4" />

  <!-- MAIN RING 3D HELICAL SPIRAL STRUCTURE -->
  <g id="ring_body">
    <!-- Outer Base Body -->
    <path d="M 90,185 A 110,55 0 0,0 310,185 L 310,215 A 110,55 0 0,1 90,215 Z" fill="#4B5563" />
    <path d="M 90,183 A 110,55 0 0,0 310,183 L 310,213 A 110,55 0 0,1 90,213 Z" fill="url(#metalGrad_graff-spiral-plain)" />

    <!-- Inner Hole Wall -->
    <ellipse cx="200" cy="183" rx="86" ry="42" fill="url(#innerGrad_graff-spiral-plain)" stroke="#9CA3AF" stroke-width="1.5" />
    
    <!-- Top & Bottom Rims -->
    <ellipse cx="200" cy="183" rx="110" ry="55" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.85" />
    <ellipse cx="200" cy="213" rx="110" ry="55" fill="none" stroke="#4B5563" stroke-width="1.5" opacity="0.6" />

    <!-- Graff Distinctive Continuous Spiral Twist Ribbon Overlay -->
    
        <path d="M 94,175 Q 200,145 306,175 Q 200,215 94,175" fill="none" stroke="#FFFFFF" stroke-width="4.5" opacity="0.85" />
        <path d="M 94,177 Q 200,147 306,177 Q 200,217 94,177" fill="none" stroke="#4B5563" stroke-width="2" opacity="0.6" />
        
        <path d="M 94,189 Q 200,159 306,189 Q 200,229 94,189" fill="none" stroke="#FFFFFF" stroke-width="4.5" opacity="0.85" />
        <path d="M 94,191 Q 200,161 306,191 Q 200,231 94,191" fill="none" stroke="#4B5563" stroke-width="2" opacity="0.6" />
        
        <path d="M 94,203 Q 200,173 306,203 Q 200,243 94,203" fill="none" stroke="#FFFFFF" stroke-width="4.5" opacity="0.85" />
        <path d="M 94,205 Q 200,175 306,205 Q 200,245 94,205" fill="none" stroke="#4B5563" stroke-width="2" opacity="0.6" />
        
        <path d="M 94,217 Q 200,187 306,217 Q 200,257 94,217" fill="none" stroke="#FFFFFF" stroke-width="4.5" opacity="0.85" />
        <path d="M 94,219 Q 200,189 306,219 Q 200,259 94,219" fill="none" stroke="#4B5563" stroke-width="2" opacity="0.6" />
        

    <!-- Diamond Sparkles for Pave Version -->
    
  </g>

  <!-- Footer Pill -->
  <g transform="translate(200, 355)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="#D1D5DB" stroke-width="1" />
    <text x="0" y="5" font-family="'Pretendard', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC" text-anchor="middle">스파이럴 밴드 링 (노다이아)</text>
  </g>
</svg>
